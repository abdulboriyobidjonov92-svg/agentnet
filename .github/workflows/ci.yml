name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # SEC-14: git tarixi bo'yicha sir skanini qo'lda ishga tushirish uchun.
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  # SEC-14: gitleaks versiyasi QOTIRILGAN — "latest" bo'lsa yuqori oqimdagi
  # qoida o'zgarishi CI'ni kutilmaganda qizartirardi (yoki jimgina
  # bo'shashtirardi). Yangilash — ataylab qilinadigan commit.
  GITLEAKS_VERSION: "8.21.2"
  # SEC-15: pip-audit ham QOTIRILGAN — yuqori oqimdagi xulq o'zgarishi
  # CI'ni kutilmaganda qizartirmasligi (yoki jimgina bo'shashtirmasligi) uchun.
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  # ---------------------------------------------------------------
  # SEC-15 — npm bog'liqlik zaifliklari (BLOKLOVCHI)
  #
  # `--omit=dev`: FAQAT prod bog'liqliklari. Dev-only zaiflik (jest,
  # eslint, turbo...) jonli xizmatga chiqmaydi — uni bloklovchi qilish
  # signalni shovqinga ko'mib, oxir-oqibat "e'tiborsiz qoldirish
  # madaniyati"ni yaratardi.
  # `--audit-level=high`: high va critical CI'ni qizartiradi. moderate/low
  # hisobotda ko'rinadi, lekin bloklamaydi (Contract §7 SEC-15 AC).
  # ---------------------------------------------------------------
  npm-audit:
    name: Dependency audit (npm, prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` ATAYLAB ishlatilmaydi: audit uchun daraxtni O'RNATISH
      # shart emas — `npm audit` lockfile'ni o'qib, advisory bazasi bilan
      # solishtiradi. Bu ishni tez va o'rnatish nosozliklaridan mustaqil
      # qiladi (audit natijasi `node_modules` holatiga bog'liq bo'lmaydi).
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Hisobot: moderate/low ham KO'RINADI (bloklamaydi). Shu bilan
      # "faqat high" gate'i past darajali zaifliklarni YASHIRMAYDI.
      - name: Full audit report (non-blocking)
        if: always()
        run: npm audit --omit=dev || true

  # ---------------------------------------------------------------
  # SEC-15 — Python engine bog'liqlik zaifliklari (BLOKLOVCHI)
  #
  # `pip-audit` da npm'dagi `--audit-level` EKVIVALENTI YO'Q — u
  # zaiflikni jiddiylik bo'yicha filtrlay olmaydi. Shuning uchun bu ish
  # HAR QANDAY topilmada qizaradi (talab qilingandan QAT'IYROQ).
  # Ataylab qabul qilingan istisno uchun yagona yo'l — `--ignore-vuln`
  # (aniq ID + sabab + muddat, `docs/status/sec15-audit.md`).
  # ---------------------------------------------------------------
  pip-audit:
    name: Dependency audit (Python engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==${{ env.PIP_AUDIT_VERSION }}

      # Bazaviy `requirements.txt` — engine prod'da AYNAN shuni o'rnatadi
      # (`requirements-camera.txt` og'ir CV paketlari ataylab tashqarida,
      # main.py ularni himoyalangan import qiladi — H4/M5).
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt --progress-spinner off

  # ---------------------------------------------------------------
  # SEC-14 — sir skaneri (BLOKLOVCHI)
  # ---------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--redact`: topilgan sir CI LOGIGA CHIQMAYDI. Usiz skanerning o'zi
      # sirni ommaviy build-logiga ko'chirib, sizishni KUCHAYTIRARDI.
      # `--no-git`: ishchi daraxt skanlanadi — ya'ni shu commit/PR bilan
      # kelgan har qanday sir ushlanadi. Tarix skani ALOHIDA (pastda).
      - name: Scan working tree
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --verbose

  # ---------------------------------------------------------------
  # SEC-14 — git TARIXI skani (qo'lda ishga tushiriladi)
  #
  # NEGA ALOHIDA VA BLOKLOVCHI EMAS: tarixdagi topilma kodni tuzatish bilan
  # hal bo'lmaydi — u INSIDENT (kalitni bekor qilish + tarixni qayta yozish),
  # ya'ni operator qarori. Uni har PR'ni bloklovchi qilish butun jamoani
  # to'xtatib qo'yardi va shoshilinch "allowlist"ga bosim yaratardi —
  # aynan shu bosim SEC-14 oldini olmoqchi bo'lgan narsa.
  # Runbook: docs/runbooks/secret-rotation.md
  # ---------------------------------------------------------------
  secrets-history:
    name: Secret scan — git history (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

  # ---------------------------------------------------------------
  # apps/web — Next.js lint, typecheck, build
  # ---------------------------------------------------------------
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ---------------------------------------------------------------
  # apps/api — NestJS typecheck, lint, build
  # ---------------------------------------------------------------
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # apps/agent-engine — Python lint (ruff), typecheck (mypy), tests
  # ---------------------------------------------------------------
  agent-engine:
    name: Agent Engine (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # Endi BLOKLOVCHI: barcha 76 pre-existing `union-attr` tuzatildi
        # (`response.content[0].text` -> `getattr(..., "text", "")`; qolgan 5 ta
        # uchinchi-tomon/inference holatga aniq `# type: ignore`). mypy toza.
        run: mypy . --ignore-missing-imports

      - name: Tests
        # M8: engine endi haqiqiy pytest to'plamiga ega (test_engine.py —
        # auth guardi, halal lug'at qatlami, retail heuristikasi, katalog).
        # Exit-5 ("test topilmadi") vaqtinchalik workaround olib tashlandi;
        # har qanday regressiya endi CI'ni to'g'ridan-to'g'ri qizartiradi.
        run: pytest --tb=short -q
        env:
          ANTHROPIC_API_KEY: "sk-ant-placeholder"
          DATABASE_URL: "postgresql://agentnet:password@localhost:5432/agentnet_test"
          REDIS_URL: "redis://localhost:6379"

  # ---------------------------------------------------------------
  # Turbo build — barcha applarni parallel build qilish
  # ---------------------------------------------------------------
  turbo-build:
    name: Turbo full build
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Turbo build
        run: npx turbo run build --filter=!@agentnet/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
