name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------
  # apps/web — Next.js lint, typecheck, build
  # ---------------------------------------------------------------
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder' }}
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ---------------------------------------------------------------
  # apps/api — NestJS typecheck, lint, build
  # ---------------------------------------------------------------
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # apps/agent-engine — Python lint (ruff), typecheck (mypy), tests
  # ---------------------------------------------------------------
  agent-engine:
    name: Agent Engine (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff mypy pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # Endi BLOKLOVCHI: barcha 76 pre-existing `union-attr` tuzatildi
        # (`response.content[0].text` -> `getattr(..., "text", "")`; qolgan 5 ta
        # uchinchi-tomon/inference holatga aniq `# type: ignore`). mypy toza.
        run: mypy . --ignore-missing-imports

      - name: Tests
        # M8: engine endi haqiqiy pytest to'plamiga ega (test_engine.py —
        # auth guardi, halal lug'at qatlami, retail heuristikasi, katalog).
        # Exit-5 ("test topilmadi") vaqtinchalik workaround olib tashlandi;
        # har qanday regressiya endi CI'ni to'g'ridan-to'g'ri qizartiradi.
        run: pytest --tb=short -q
        env:
          ANTHROPIC_API_KEY: "sk-ant-placeholder"
          DATABASE_URL: "postgresql://agentnet:password@localhost:5432/agentnet_test"
          REDIS_URL: "redis://localhost:6379"

  # ---------------------------------------------------------------
  # apps/web — Playwright e2e (real Next.js + real NestJS + Postgres)
  # ---------------------------------------------------------------
  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentnet
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentnet -d agentnet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agentnet:password@localhost:5432/agentnet_test
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      AUTH_JWT_SECRET: ci-e2e-auth-jwt-secret-not-for-prod-use-only
      ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddee"
      INTERNAL_API_TOKEN: agentnet-internal-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: apps/web

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ---------------------------------------------------------------
  # Turbo build — barcha applarni parallel build qilish
  # ---------------------------------------------------------------
  turbo-build:
    name: Turbo full build
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Turbo build
        run: npx turbo run build --filter=!@agentnet/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_API_URL: http://localhost:3001
