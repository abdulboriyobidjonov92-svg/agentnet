version: "3.9"

# Lokal ishlab chiqish uchun Docker Compose — faqat Postgres.
# Next.js va NestJS lokal `npm run dev` orqali ishga tushiriladi.
#
# Eslatma: ilgari bu yerda Redis xizmati bor edi, lekin kodning HECH BIR joyida
# Redis ishlatilmaydi (ThrottlerModule in-memory, render ham Redis provision
# qilmaydi). Chalkashlik bo'lmasligi uchun "fantom" Redis olib tashlandi. Agar
# kelajakda taqsimlangan rate-limit/kesh kerak bo'lsa, o'shanda qo'shiladi.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentnet_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnet -d agentnet_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # opsional: lokal agent-engine'ni ham konteynerda ishlatish uchun
  agent-engine:
    build:
      context: ./apps/agent-engine
      dockerfile: Dockerfile
    container_name: agentnet_agent_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://agentnet:password@postgres:5432/agentnet_dev
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full  # faqat: docker compose --profile full up

volumes:
  postgres_data:

networks:
  default:
    name: agentnet_network
