# AgentNet — Render blueprint (bitta faylda 3 servis + Postgres)
#
# Foydalanish:
#   1. Bu repo'ni GitHub'ga push qiling
#   2. Render → New → Blueprint → repo'ni ulang → Apply
#   3. (ixtiyoriy) agentnet-engine va agentnet-api ga ANTHROPIC_API_KEY qo'shing
#      — bo'lmasa platforma to'liq heuristik/demo rejimda ishlaydi.
#
# Cross-servis URL'lari Render'ning barqaror naqshidan foydalanadi:
#   https://<service-name>.onrender.com
# Agar servis nomlarini o'zgartirsangiz, quyidagi URL'larni ham yangilang.
databases:
  - name: agentnet-db
    plan: free
    databaseName: agentnet
    user: agentnet

services:
  # 1) FastAPI agent-engine — orkestrator + 5 wow imkoniyat + AgentOS
  - type: web
    name: agentnet-engine
    runtime: docker
    plan: free
    dockerfilePath: ./apps/agent-engine/Dockerfile
    dockerContext: ./apps/agent-engine
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # ixtiyoriy — bo'lmasa demo/heuristik rejim
      # web.automate/connector.invoke uchun API'ga ichki chaqiruv
      - key: API_URL
        value: https://agentnet-api-zf1h.onrender.com
      - key: INTERNAL_API_TOKEN
        sync: false        # api servisidagi bilan bir xil qiymat bo'lishi shart
      - key: AGENT_MAX_TOOL_ITERATIONS
        value: "8"

  # 2) NestJS API — Core SaaS (auth, agents, twin, goals, intelligence, agentos)
  - type: web
    name: agentnet-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentnet-db
          property: connectionString
      - key: AGENT_ENGINE_URL
        value: https://agentnet-engine.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # CORS — bo'lmasa brauzerdan kelgan hamma so'rov bloklanadi (production bug)
      - key: NEXT_PUBLIC_APP_URL
        value: https://agentnet-web-cstn.onrender.com
      # web.automate/connector.invoke ichki chaqiruvlari uchun umumiy token
      - key: INTERNAL_API_TOKEN
        sync: false        # engine servisidagi bilan bir xil qiymat bo'lishi shart
      # Rate limiting / xarajat himoyasi (env bo'lmasa kod ichidagi defaultlar ishlaydi)
      - key: USAGE_FREE_CHAT_PER_DAY
        value: "20"
      - key: USAGE_FREE_AGENTS_MAX
        value: "5"
      - key: USAGE_GLOBAL_LLM_PER_DAY
        value: "2000"
      # Prepaid billing — foydalanuvchi o'zi uchun to'laydi
      - key: BILLING_PRICE_PER_MESSAGE_TIYIN
        value: "50000"
      - key: BILLING_PRO_MONTH_TIYIN
        value: "2500000"
      - key: PAYME_MERCHANT_ID
        sync: false        # ixtiyoriy — bo'lmasa to'ldirish funksiyasi aniq xato beradi
      - key: PAYME_SECRET_KEY
        sync: false
      - key: PAYME_TEST_MODE
        value: "true"

  # 3) Next.js web — deep-space UI + 3D + AgentOS command center
  - type: web
    name: agentnet-web
    runtime: node
    plan: free
    # --include=dev shart: NODE_ENV=production muhitida npm devDependencies'ni
    # o'tkazib yuboradi, lekin Next.js build vaqtida tailwindcss/postcss/
    # autoprefixer'ga muhtoj (ular devDependencies'da) — shu sabab build qulaydi.
    buildCommand: npm install --include=dev && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://agentnet-api-zf1h.onrender.com
      - key: AGENT_ENGINE_URL
        value: https://agentnet-engine.onrender.com
      - key: NODE_ENV
        value: production
