# AgentNet — Render blueprint (bitta faylda 3 servis + Postgres)
#
# Foydalanish:
#   1. Bu repo'ni GitHub'ga push qiling
#   2. Render → New → Blueprint → repo'ni ulang → Apply
#   3. (ixtiyoriy) agentnet-engine va agentnet-api ga ANTHROPIC_API_KEY qo'shing
#      — bo'lmasa platforma to'liq heuristik/demo rejimda ishlaydi.
#   4. SEC-10 (majburiy qo'lda qadam): agentnet-api va agentnet-web'ga
#      AGENT_ENGINE_URL ni qo'lda kiriting — quyidagi izohga qarang.
#
# OMMAVIY (public) servislar URL'i Render'ning barqaror naqshidan foydalanadi:
#   https://<service-name>.onrender.com
# Agar servis nomlarini o'zgartirsangiz, quyidagi URL'larni ham yangilang.
# Engine ENDI ommaviy emas (SEC-10) — uning URL'i yo'q, xususiy tarmoq
# manzili bor (`http://<internal-host>:<port>`).
#
# ⚠️ MINTAQA (region) SHARTI — SEC-10 uchun kritik: Render xususiy tarmog'i
#   FAQAT bitta akkaunt + bitta mintaqa ichida ishlaydi. Bu blueprint'da
#   `region` ATAYLAB ko'rsatilmagan (mavjud servislar allaqachon akkaunt
#   default mintaqasida yaratilgan; bu yerga boshqa mintaqa yozilsa
#   deploy buziladi). Apply'dan keyin uchala servis + DB bir xil mintaqada
#   ekanini Render panelidan TASDIQLANG.
#
# ⚠️ PLAN OGOHLANTIRISHI (H4):
#   • Postgres `starter` (pullik, ~$7/oy) — free-plan DB ~90 kunda
#     O'CHIRILAR edi (barcha akkaunt/balans yo'qolardi). Jonli foydalanuvchilar
#     uchun bu majburiy xarajat. Baribir muntazam backup tavsiya etiladi.
#   • Engine endi `starter` — Render'da private service uchun `free`
#     instance turi UMUMAN YO'Q (free faqat web service / static site /
#     Postgres / Key Value). SEC-10 narxi: ~$7/oy. Yon foyda: pullik
#     instance spin-down BO'LMAYDI (engine sovuq start yo'qoladi).
#   • api va web hali `free`: harakatsizlikda spin-down -> birinchi so'rov
#     30-60s sovuq start; cron'lar (brifing/agent-billing/goals) o'tkazib
#     yuborilishi mumkin. Jonli trafik oldidan API'ni ham starter'ga o'tkazing.
#     Free web servis xususiy tarmoqqa so'rov YUBORA oladi (engine'ga borish
#     ishlaydi), lekin xususiy tarmoqdan so'rov QABUL QILA olmaydi.
#   • Free RAM 512MB. Engine'ning og'ir CV-kutubxonalari (torch) endi bazaviy
#     o'rnatishdan chiqarilgan (requirements-camera.txt) — OOM xavfi kamaydi.
databases:
  - name: agentnet-db
    # DIQQAT: free emas — free Postgres 90 kunda o'chib, BARCHA foydalanuvchi
    # ma'lumotlari yo'qolardi. Starter — launch uchun minimal xavfsiz daraja.
    plan: starter
    databaseName: agentnet
    user: agentnet

# Servislararo umumiy sirlar — Render bir marta generatsiya qiladi va guruhga
# ulangan HAR uchala servisga BIR XIL qiymatni beradi. INTERNAL_API_TOKEN
# ayni shu — agent-engine (ichki auth), API (refund guard) va web BFF (engine +
# refund chaqiruvi) uchun aynan bir xil bo'lishi SHART, aks holda ichki
# chaqiruvlar 401 bo'ladi. Qo'lda kiritishga hojat yo'q (generateValue).
envVarGroups:
  - name: agentnet-shared
    envVars:
      - key: INTERNAL_API_TOKEN
        generateValue: true

services:
  # 1) FastAPI agent-engine — orkestrator + 5 wow imkoniyat + AgentOS
  #
  # SEC-10 (ADR-004; Contract A5 va Konstitutsiya qoidasi #5 — "Engine hech
  # qachon ommaviy internetga chiqarilmaydi"): engine `type: web` dan
  # `type: pserv` (Render Private Service) ga o'tdi.
  #   • Private service `onrender.com` subdomeni OLMAYDI va ommaviy
  #     internetdan umuman ochilmaydi.
  #   • Unga faqat SHU Render akkaunti + SHU mintaqadagi boshqa servislar
  #     xususiy tarmoq orqali murojaat qila oladi.
  #   • Ichki `x-internal-token` (main.py `internal_token_guard`) SAQLANADI —
  #     ikki qatlamli himoya: tarmoq + ilova. Biri buzilsa ikkinchisi ushlaydi.
  #
  # ⚠️ Render servis TURINI joyida o'zgartirmaydi (`type` — o'zgarmas maydon).
  #    Migratsiya tartibi docs/guides/deployment.md → "SEC-10" bo'limida.
  - type: pserv
    name: agentnet-engine
    runtime: docker
    # Private service uchun `free` instance turi Render'da YO'Q — eng past
    # daraja `starter`. Bu SEC-10'ning real (va yagona) xarajati.
    plan: starter
    dockerfilePath: ./apps/agent-engine/Dockerfile
    dockerContext: ./apps/agent-engine
    # `healthCheckPath` ATAYLAB OLIB TASHLANDI: Render blueprint
    # spetsifikatsiyasida bu maydon "Web services only" deb belgilangan.
    # Engine `/health` endpointi o'zi joyida qoladi (auth'siz, _OPEN_PATHS) —
    # unga xususiy tarmoq ichidan murojaat qilinadi.
    envVars:
      # Ichki auth guardi shu belgi bilan production rejimini aniqlaydi:
      # ENV=production bo'lsa INTERNAL_API_TOKEN majburiy (fail-closed) —
      # commlik default token bilan engine ochiq qolmaydi.
      - key: ENV
        value: production
      # Umumiy INTERNAL_API_TOKEN — guruhdan (API va web bilan aynan bir xil).
      - fromGroup: agentnet-shared
      - key: ANTHROPIC_API_KEY
        sync: false        # ixtiyoriy — bo'lmasa demo/heuristik rejim
      # web.automate/connector.invoke uchun API'ga ichki chaqiruv.
      # (API — ommaviy web servis, shuning uchun bu URL o'zgarishsiz qoladi.)
      - key: API_URL
        value: https://agentnet-api-zf1h.onrender.com
      - key: AGENT_MAX_TOOL_ITERATIONS
        value: "8"
      # Phase 5 (P5.1): xato kuzatuvi. `sync: false` — DSN operator
      # tomonidan Render UI'da kiritiladi va blueprint'da (ya'ni git'da)
      # HECH QACHON turmaydi. Bo'sh qoldirilsa engine Sentry'siz,
      # hech qanday xulq farqisiz ishlaydi.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Render hujjati: xususiy tarmoq aloqasi uchun 10000, 18012, 18013,
      # 19099 portlaridan FOYDALANIB BO'LMAYDI. Render esa servisga default
      # PORT=10000 beradi — agar engine o'sha portga bog'lansa, uni xususiy
      # tarmoqdan CHAQIRIB BO'LMAS edi (jim ishlamaydigan deploy). Shuning
      # uchun portni aniq belgilaymiz; Dockerfile default'i ham 8000.
      - key: PORT
        value: "8000"

  # 2) NestJS API — Core SaaS (auth, agents, twin, goals, intelligence, agentos)
  - type: web
    name: agentnet-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Haqiqiy liveness endpoint (M7) — ilgari /api/docs (Swagger) edi, bu
    # Swagger'ni prod'da doim ochiq turishga majbur qilardi.
    #
    # PHASE 5 (P5.5): `/api/health` -> `/api/health/ready`.
    # NEGA: Render `healthCheckPath` ni DEPLOY DARVOZASI sifatida
    # ishlatadi ("bu instansga trafik yuborsam bo'ladimi?") — bu aynan
    # READINESS savoli. `/api/health/ready` Postgres va kritik
    # konfiguratsiyani tekshiradi, ya'ni DB'siz yoki env'i chala instans
    # jonli trafikni QABUL QILMAYDI (ilgari u 200 qaytarib, buzuq
    # holatda ham live bo'lardi).
    #
    # ENGINE ATAYLAB TEKSHIRILMAYDI: engine uzilishida API'ning qolgan
    # 90% i (auth, balans, to'lov, admin) ishlaydi — uni deploy darvozasi
    # qilish kichik uzilishni to'liq uzilishga aylantirardi.
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentnet-db
          property: connectionString
      # SEC-10: engine endi private service — bu qiymat ommaviy URL EMAS,
      # xususiy tarmoq manzili.
      #
      # NEGA bu yerga yozib qo'yilmagan (`sync: false`): Render xususiy
      # hostname'ga taxmin qilib bo'lmaydigan qo'shimcha beradi (rasmiy
      # hujjatdagi misol: `elasticsearch-2j3e:9200`). Uni bu yerda taxmin
      # qilish = jim ishlamaydigan deploy. Blueprint'da satr-birlashtirish
      # ham yo'q (`fromService` faqat `host`/`port`/`hostport` beradi, ya'ni
      # protokolsiz `host:port`), shuning uchun to'liq URL operator tomonidan
      # kiritiladi — infratuzilma faraz qilinmaydi.
      #
      # QIYMATNI QAYERDAN OLASIZ:
      #   Render → agentnet-engine → Connect → Internal → internal address
      #   (masalan `agentnet-engine-2j3e:8000`)
      # KIRITASIZ (protokol bilan):
      #   http://agentnet-engine-2j3e:8000
      #
      # Bu env prod'da bo'lmasa API BOOT BO'LMAYDI (validateEnv, fail-closed) —
      # jimgina `http://localhost:8000` fallback'iga tushib qolmaslik uchun.
      - key: AGENT_ENGINE_URL
        sync: false
      # At-rest shifrlash kaliti — prod'da bo'lmasa API boot'da qulaydi
      # (CryptoService fail-closed). Render generatsiya qiladi, qo'lda kiritilmaydi.
      - key: ENCRYPTION_KEY
        generateValue: true
      # Sessiya-token imzo kaliti — bo'lmasa har restartda barcha foydalanuvchilar
      # tizimdan chiqib ketadi (token.util tasodifiy fallback). Render generatsiya qiladi.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Phase 5 (P5.1/P5.4): kuzatuv. DSN va alert kanali `sync: false` —
      # ular git'ga tushmaydi. Ikkalasi ham IXTIYORIY: bo'sh bo'lsa API
      # Sentry'siz ishlaydi va alertlar faqat strukturaviy log sifatida
      # qoladi (soxta "yuborildi" holati yaratilmaydi).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # P5.4 signal kanali — SEC-11 dan beri mavjud AYNI env (yangi
      # integratsiya yaratilmaydi).
      - key: OWNER_ALERT_TELEGRAM_CHAT_ID
        sync: false
      # CORS — bo'lmasa brauzerdan kelgan hamma so'rov bloklanadi (production bug).
      # Bu FRONTEND'ning ommaviy origin'i. ADR-021 bo'yicha frontend Vercel'ga
      # ko'chganda bu qiymat Vercel domeniga o'zgartiriladi (main.ts bitta aniq
      # origin qabul qiladi). Quyidagi Render web servisi — o'tish davri /
      # zaxira deploy.
      - key: NEXT_PUBLIC_APP_URL
        value: https://agentnet-web-cstn.onrender.com
      # web.automate/connector.invoke ichki chaqiruvlari uchun umumiy token
      # (engine va web bilan aynan bir xil — guruhdan keladi).
      - fromGroup: agentnet-shared
      # Rate limiting / xarajat himoyasi (env bo'lmasa kod ichidagi defaultlar ishlaydi)
      - key: USAGE_FREE_CHAT_PER_DAY
        value: "20"
      - key: USAGE_FREE_AGENTS_MAX
        value: "5"
      - key: USAGE_GLOBAL_LLM_PER_DAY
        value: "2000"
      # Prepaid billing — foydalanuvchi o'zi uchun to'laydi
      - key: BILLING_PRICE_PER_MESSAGE_TIYIN
        value: "50000"
      - key: BILLING_PRO_MONTH_TIYIN
        value: "2500000"
      - key: PAYME_MERCHANT_ID
        sync: false        # ixtiyoriy — bo'lmasa to'ldirish funksiyasi aniq xato beradi
      - key: PAYME_SECRET_KEY
        sync: false
      - key: PAYME_TEST_MODE
        value: "true"
      # Login OTP — email-kod yetkazish uchun SHART (production'da bo'lmasa
      # server ishga tushmaydi, [[EmailService]] fail-closed).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "AgentNet <login@agentnet.app>"
      # Ixtiyoriy — bo'lmasa telefon orqali kirish avtomatik o'chirilgan
      # holda qoladi (email hali ham ishlaydi, server qulamaydi).
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_SMS_FROM
        value: "4546"

  # 3) Next.js web — deep-space UI + 3D + AgentOS command center
  #
  # ADR-021: yakuniy arxitekturada frontend **Vercel**da turadi, backend
  # (api + engine + Postgres + Redis + kelajakdagi worker'lar) — Render'da.
  # Bu servis o'tish davri va zaxira deploy sifatida saqlanadi; SEC-10 dan
  # keyin ikkala joyda ham AYNAN bir xil env to'plami bilan ishlaydi
  # (frontend endi engine'ni bilmaydi).
  - type: web
    name: agentnet-web
    runtime: node
    plan: free
    # --include=dev shart: NODE_ENV=production muhitida npm devDependencies'ni
    # o'tkazib yuboradi, lekin Next.js build vaqtida tailwindcss/postcss/
    # autoprefixer'ga muhtoj (ular devDependencies'da) — shu sabab build qulaydi.
    buildCommand: npm install --include=dev && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://agentnet-api-zf1h.onrender.com
      # SEC-10: `AGENT_ENGINE_URL` bu yerdan ATAYLAB OLIB TASHLANDI.
      # Frontend endi engine'ni umuman bilmaydi — chat oqimi API orqali
      # o'tadi (`POST /api/agents/stream`). Natijada frontend deploy-portativ:
      # unga faqat NEXT_PUBLIC_API_URL + INTERNAL_API_TOKEN kerak, ya'ni
      # ayni shu env to'plami bilan Vercel'da ham ishlaydi (ADR-021).
      #
      # BFF (/api/chat/stream, /billing/refund, /agents/stream) ichki token
      # bilan murojaat qiladi — engine va API bilan aynan bir xil qiymat.
      # ⚠️ Vercel'ga ko'chirilganda INTERNAL_API_TOKEN qo'lda ko'chiriladi
      #    (env-guruh faqat Render ichida ishlaydi).
      - fromGroup: agentnet-shared
      - key: NODE_ENV
        value: production
      # Phase 5 (P5.1): web SERVER/EDGE tomoni uchun DSN.
      - key: SENTRY_DSN
        sync: false
      # BRAUZER tomoni — ALOHIDA DSN. Bu qiymat klient bundle'iga
      # tushadi (Sentry uchun normal), shuning uchun server DSN'i bilan
      # ARALASHTIRILMAYDI. Sozlansa CSP `connect-src` avtomat kengayadi.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production
